name: Build precompiled RunPod image

on:
  workflow_dispatch:
    inputs:
      cuda_arch_list:
        description: CUDA architectures to bake into the native modules
        default: '8.0;8.6;8.9;9.0;12.0'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      IMAGE: ghcr.io/pareekshit28/person-to-4dgs
      CUDA_ARCH_LIST: ${{ inputs.cuda_arch_list || '8.0;8.6;8.9;9.0;12.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate architecture list
        run: |
          python3 - <<'PY'
          import os, re
          value = os.environ['CUDA_ARCH_LIST']
          if not re.fullmatch(r'(?:8\.0|8\.6|8\.9|9\.0|12\.0)(?:;(?:8\.0|8\.6|8\.9|9\.0|12\.0))*', value):
              raise SystemExit('Unsupported CUDA architecture list')
          PY
      - name: Free unused toolchains on this disposable builder
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
          python3 - <<'PY'
          import shutil
          free = shutil.disk_usage('/').free / 1024**3
          print(f'Available image build disk: {free:.1f} GiB')
          if free < 45:
              raise SystemExit('This builder needs at least 45 GiB free after cleanup for the CUDA/PyTorch image.')
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish compiled image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pareekshit28/person-to-4dgs:latest
            ghcr.io/pareekshit28/person-to-4dgs:sha-${{ github.sha }}
          build-args: |
            CUDA_ARCH_LIST=${{ env.CUDA_ARCH_LIST }}
            MAX_JOBS=2
            VCS_REF=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/pareekshit28/person-to-4dgs:buildcache
          cache-to: type=registry,ref=ghcr.io/pareekshit28/person-to-4dgs:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          provenance: true
      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          image = os.environ['IMAGE']
          digest = os.environ['DIGEST']
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              f'Built `{image}:latest`\n\nImmutable image: `{image}@{digest}`\n\n'
              'Dependencies and native CUDA modules were compiled in this build. '
              'A GPU execution check runs when a GPU pod starts.\n'
          )
          PY
